<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c">
<meta name="description" content="Offline Bench: brass lots, load recipes, serialised batches and printable QR labels.">
<title>Bench</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Type stack, shared with Zero so the two apps read as one product.
 *
 * Both faces are vendored in packages/fonts, copied into each app's dist at
 * build time and precached by each service worker. Zero used to pull them with
 * an @import from Google Fonts; that is a blocking request to a third-party
 * host in an app meant to be used with no signal, and it proved itself by
 * hanging this app's test suite when I copied it here. Served from our own
 * origin there is no difference between online and off, and no third party
 * involved in whether the app renders. */
:root{
  --fh:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --fm:'Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* Greys taken from Zero, value for value, because the two apps are used in
   * the same session and were visibly different products: Bench's background
   * was #16181c against Zero's #0f1117, with every surface and border a little
   * off from its counterpart. Zero is the app people already know, so its
   * palette is the one that wins.
   *
   * The accent deliberately does NOT match. Brass here, orange in Zero, is the
   * one thing that tells you at a glance which app you are looking at -- and
   * with both installed side by side on a home screen, that is worth keeping. */
  --bg:#0f1117; --panel:#1a1d27; --panel2:#252836; --line:#353848;
  --ink:#f0f2f8; --ink2:#9099b0; --ink3:#6c7480;
  --brass:#c9a227; --ok:#3db87a; --warn:#e8a317; --bad:#f06060;
  --r:9px; --tap:44px;
  /* The viewport meta says viewport-fit=cover, which deliberately extends the
   * page UNDER the status bar and the home indicator. That only works if the
   * insets are paid back. Only the bottom one was, so on any notched phone the
   * sticky header rode up under the clock and every screen read as too high.
   * Left and right matter in landscape, where the notch eats a side. */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
/* Short screens must still fill the window.
 *
 * With no content the page was shorter than the viewport, so the area between
 * the end of the content and the fixed tab bar painted as bare canvas. 100dvh
 * tracks the DYNAMIC viewport, which is the one that changes as Safari shows
 * and hides its toolbar -- 100vh would freeze at the large size and leave the
 * page overflowing whenever the toolbar is visible. */
/* An app shell, not a scrolling document.
 *
 * The tab bar used to be `position:fixed; bottom:0`, which pins it to the
 * VIEWPORT -- and on iOS the viewport is not a stable thing. Safari's bottom
 * toolbar auto-hides once a page scrolls, so a screen with enough content to
 * scroll grew its viewport and dropped the bar to the bottom, while a short
 * screen kept the toolbar and left the bar sitting higher. Same CSS, two
 * different results, which is exactly what looked broken.
 *
 * The page is now a fixed-height column: header, a scrolling middle, then the
 * bar. Nothing is pinned to the viewport, so the bar sits at the bottom of
 * whatever space the browser actually gives us and stops caring what the
 * browser does with the rest. Every screen scrolls in the same element, so a
 * full inventory and an empty one behave identically.
 *
 * 100dvh, not 100vh: dvh tracks the dynamic viewport, which is the one that
 * changes as the toolbar appears and disappears. 100vh freezes at the large
 * size and would leave the bar below the fold whenever the toolbar is up. */
html{height:100%}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--ink);
  font:15px/1.5 var(--fh);
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .4em;line-height:1.25;font-weight:650}
h2{font-size:16px}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--fm)}

header{flex:0 0 auto;z-index:30;background:rgba(22,24,28,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  /* One declaration, not a shorthand plus an override: a `padding` shorthand
   * later in the rule silently resets padding-top, which is how this was
   * broken the first time it was fixed. */
  padding:calc(10px + var(--safe-t)) calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));
  display:flex;align-items:center;gap:10px;min-height:calc(52px + var(--safe-t))}
header .title{font-weight:650;font-size:16px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sub{font-size:12px;color:var(--ink3);font-weight:400}
.backbtn{background:none;border:0;color:var(--brass);font-size:15px;padding:6px 4px;
  margin-left:-4px;cursor:pointer;min-height:var(--tap);display:flex;align-items:center}
/* Header cloud chip. Three states, three colours: brass = sign in (an action
 * that has not been taken), warn = records waiting, dim = everything sent. */
.syncchip{flex:0 0 auto;background:none;border:1px solid var(--line);border-radius:999px;
  color:var(--ink2);font-size:12px;line-height:1;padding:7px 10px;cursor:pointer;
  /* 38, not the 34 it shipped with for about ten minutes: the suite's floor is
   * 36px and it is right -- a header control is hit with a thumb at arm's
   * length. min-width keeps the bare "⇅" state from becoming a dot. */
  display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  min-height:38px;min-width:44px}
.syncchip.act{border-color:var(--brass);color:var(--brass)}
.syncchip.wait{border-color:var(--warn);color:var(--warn)}
.syncchip.busy{opacity:.6}
/* The only scrolling element in the app. `overscroll-behavior:contain` stops a
 * scroll that reaches the end of a list from rubber-banding the whole page,
 * which on iOS is what makes a fixed shell feel like it is coming apart. */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px calc(14px + var(--safe-r)) 14px calc(14px + var(--safe-l));
  max-width:820px;margin:0 auto;width:100%}

/* The tab bar, and the strip underneath it.
 *
 * On iOS in standalone mode with viewport-fit=cover, `bottom:0` anchors to the
 * SAFE-AREA edge rather than the physical bottom of the screen. The bar
 * therefore stopped short and the home-indicator strip below it showed the page
 * background -- a darker band under the icons that read as a misaligned bar.
 *
 * Chromium has no insets, so a headless viewport puts bottom:0 at the true
 * bottom and the bug is invisible to any rendered test. It was only ever going
 * to be found on a real phone.
 *
 * The shim is a second fixed element pinned BELOW the bar, in the bar's own
 * colour. Where bottom:0 already is the physical bottom it hangs off-screen and
 * is clipped, costing nothing; where it is not, it fills the strip. Correct
 * under both behaviours without having to detect which one is in play. */
/* Last row of the column rather than a fixed overlay, so it is always at the
 * bottom of the space the browser gave us -- above Safari's toolbar when there
 * is one, at the screen edge when there is not.
 *
 * NO home-indicator reserve. Reserving var(--safe-b) is the textbook thing to
 * do and it looked wrong: 34px of bar-coloured space under the icons that
 * reads as padding rather than as safety margin, on a bar only 57px tall. iOS
 * draws the indicator over the bar instead, which is what every native tab bar
 * on the platform does. The trade is that the labels sit close to the
 * indicator; the gain is that the bar looks deliberate. */
nav.tabs{flex:0 0 auto;z-index:40;display:flex;
  background:rgba(30,33,39,.97);
  border-top:1px solid var(--line)}
/* The strip under the bar.
 *
 * On iOS in standalone mode with viewport-fit=cover, `bottom:0` anchors to the
 * SAFE-AREA edge rather than the physical bottom, so the bar stopped short and
 * the page background showed through beneath it as a darker band. Chromium has
 * no insets, so headless rendering puts bottom:0 at the true bottom and the bug
 * cannot be reproduced by any test -- it was only ever findable on a phone.
 *
 * This is a second fixed element pinned below the bar in the bar's own colour.
 * Where bottom:0 already IS the physical bottom it hangs off-screen and is
 * clipped, costing nothing; where it is not, it fills the strip. Correct under
 * both behaviours without needing to detect which is in play. */

/* Geometry matched to Zero's `.tab` (padding 8px 4px 10px, gap 2px, label 10px)
 * so the two bars read as one product. Bench reserved var(--safe-b) below the
 * icons and Zero reserved nothing, which put Bench's row a third of an inch
 * higher -- side by side, the reloading app looked misaligned. Whether to sit
 * above the home indicator is a decision the two apps have to make the same
 * way, and Zero's is the one already in front of users. */
nav.tabs button{flex:1;background:none;border:0;color:var(--ink3);padding:8px 4px 10px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;
  cursor:pointer;min-height:var(--tap);justify-content:center}
nav.tabs button.on{color:var(--brass)}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:12px}
.card.tight{padding:11px 12px}
.card h2{margin-bottom:10px}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.big{font-size:17px;font-weight:700}.huge{font-size:22px;font-weight:700;letter-spacing:.02em}
.center{text-align:center;display:flex;justify-content:center}
.m0{margin:0}.mt3{margin-top:3px}.mt4{margin-top:4px}.mt5{margin-top:5px;display:block}
.mt6{margin-top:6px}.mt7{margin-top:7px}.mt8{margin-top:8px}.mt10{margin-top:10px}
.mt12{margin-top:12px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.grow1{flex:1;min-width:0}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rowline{padding:8px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.pointer{cursor:pointer}
.hidden{display:none!important}

dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
dl.kv dt{color:var(--ink3);white-space:nowrap}
dl.kv dd{margin:0;text-align:right}
dl.kv dd.mono{font-variant-numeric:tabular-nums}

.listitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;margin-bottom:9px;cursor:pointer;min-height:var(--tap);color:inherit}
.listitem.static{cursor:default}
.listitem:not(.static):active{background:var(--panel2)}
.listitem .grow{flex:1;min-width:0}
.listitem .ttl{font-weight:600;font-size:14.5px;display:block}
.listitem .sub{font-size:12.5px;color:var(--ink3);margin-top:1px;display:block}
.chev{color:var(--ink3);flex:none}

.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:650;
  letter-spacing:.03em;padding:3px 8px;border-radius:999px;border:1px solid;
  text-transform:uppercase;white-space:nowrap}
.chip.ok{color:#8ce99a;border-color:#2b6b38;background:#14301c}
.chip.warn{color:#ffd866;border-color:#7a5c14;background:#332711}
.chip.bad{color:#ffa8a8;border-color:#8a2b2b;background:#3a1414}
.chip.neutral{color:var(--ink2);border-color:var(--line);background:var(--panel2)}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.fhint{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px}
/* Every text-ish input, defined by EXCLUSION rather than by listing types.
 *
 * The old selector enumerated text/number/date and therefore missed email and
 * password -- which are the only two fields on the sign-in screen. Those fell
 * back to the browser default (a white box) while inheriting the app's
 * near-white text colour, so the sign-in form was light grey on white and
 * effectively invisible. Listing the handful of inputs that must NOT be styled
 * is a shorter and more honest list than trying to enumerate the ones that
 * must, and it does not silently break the next time a field type is added. */
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=button]):not([type=submit]),
select,textarea{
  width:100%;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;
  padding:10px 11px;min-height:var(--tap);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
/* Safari paints its own background on an autofilled field and ignores `color`
 * there. -webkit-text-fill-color and an inset shadow are the only properties
 * it honours -- without them, a remembered email reappears as dark-on-yellow. */
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--panel2) inset;
  caret-color:var(--ink)}
::placeholder{color:var(--ink3);opacity:1}
textarea{min-height:70px;resize:vertical}
input.cb{width:20px;height:20px;min-height:0;flex:none}
input[type=range]{min-height:0;padding:0;background:none;border:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 15px;min-height:var(--tap);cursor:pointer;font-weight:600;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#20180a}
.btn.danger{color:#ffa8a8;border-color:#8a2b2b;background:transparent}
/* An armed delete. Filled rather than outlined, because the difference between
 * "the button that deletes" and "the button that is about to delete" has to be
 * visible without reading the label. */
.btn.danger.armed{background:#8a2b2b;color:#fff;border-color:#b34747}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}

.serialbox{display:flex;gap:9px}
.serialbox input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;
  letter-spacing:.10em;text-transform:uppercase;text-align:center}
.serialbox input.bad{border-color:var(--bad)}
.serialbox input.good{border-color:var(--ok)}
.err{color:#ffa8a8}.warnt{color:#ffd866}

.pos{margin-bottom:14px}
.pos .poshdr{display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:7px;gap:10px}
.pos .poshdr b{font-size:14px}
.pos .poshdr span{font-size:12px;color:var(--ink3)}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);cursor:pointer;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
  font-size:10px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.6);color:#fff}
.sw.on{border-color:var(--brass);box-shadow:0 0 0 3px rgba(201,162,39,.28)}
.sw.none{background:repeating-linear-gradient(45deg,#2a2e36,#2a2e36 5px,#20232a 5px,#20232a 10px);
  color:var(--ink2);text-shadow:none}
.sw.any{background:var(--panel2);color:var(--ink2);text-shadow:none}

.casewrap{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:10px;display:flex;justify-content:center}
svg.case{width:100%;height:auto;max-width:340px;display:block}
svg.casemini{width:76px;height:auto;flex:none}

.capbar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.linkish{background:none;border:0;padding:0 6px 0 0;font:inherit;color:var(--brass);cursor:pointer;text-decoration:underline}
.capbar i{display:block;height:100%;background:var(--brass)}

.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;
  border:1px solid;display:flex;gap:9px;align-items:flex-start}
.banner.bad{color:#ffc9c9;border-color:#8a2b2b;background:#2e1212}
.banner.warn{color:#ffe8a3;border-color:#7a5c14;background:#2b2210}
.banner.info{color:#c5dcf0;border-color:#1b4a72;background:#0f2231}
.banner .small{display:block;margin-top:3px}

.empty{text-align:center;color:var(--ink3);padding:26px 14px;font-size:14px}
.empty p{margin:0 0 12px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--safe-b));z-index:60;pointer-events:none;
  background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.45)}

/* -------------------------------------------------------------- labels */
.label-preview{background:#fff;border-radius:8px;display:inline-block;
  box-shadow:0 3px 14px rgba(0,0,0,.4)}
.lbl{width:2.5in;height:1.5in;padding:.07in .09in;box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#000;background:#fff;display:flex;flex-direction:column;
  border:1px dashed #bbb;position:relative;overflow:hidden;
  /* Browsers drop BACKGROUND colours when printing unless asked not to, and
   * this label has two that carry meaning: the red "DO NOT FIRE" band, and
   * previously the coloured mark dots. Both printed white -- a quarantine
   * warning that vanishes on paper is worse than no warning, because the label
   * looks complete. The case drawing is SVG fill, which is content rather than
   * background and prints either way, but the band still needs this. */
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.lbl .cart{font-size:11pt;font-weight:800;line-height:1.02}
.lbl .load{font-size:7.2pt;line-height:1.18;margin-top:1px}
.lbl .btm{margin-top:auto;display:flex;align-items:flex-end;gap:5px}
.lbl .btm .grow1{display:flex;flex-direction:column;min-width:0}
.lbl .ser{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10pt;
  font-weight:700;letter-spacing:.03em;line-height:1.15}
.lbl .meta{font-size:6.4pt;color:#333;line-height:1.25}
.lbl .qr{width:.55in;height:.55in;flex:none}
.lbl .qr svg{width:100%;height:100%;display:block}
.lbl .band{position:absolute;left:0;right:0;top:0;background:#c00;color:#fff;
  font-size:6.8pt;font-weight:800;text-align:center;letter-spacing:.05em;padding:1px 0}
.lbl.hasband{padding-top:.17in}
.lbl .marks{display:flex;gap:5px;align-items:center;margin-top:2px}
/* The case drawing, sized for a 2.5in label. Width is the constraint: the
 * viewBox is 300x88, so 1.05in of width is about 0.31in of height, which fits
 * between the load block and the serial row without pushing either. */
.lbl .case{width:1in;height:auto;flex:none;display:block;margin-top:1px}
.lbl .marks .ms{font-size:6.2pt;color:#333;line-height:1.2}

@media print{
  body{background:#fff;color:#000;padding:0}
  header,nav.tabs,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .label-preview{box-shadow:none}
  .lbl{page-break-inside:avoid}
  .sheet{display:grid;grid-template-columns:repeat(2,2.5in);gap:.18in;
    justify-content:center;padding:.3in}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <button class="backbtn hidden" id="back" aria-label="Back">‹ Back</button>
  <div class="title" id="title">Bench</div>
  <!-- Cloud status lives in the header because the question it answers ("am I
       signed in, is anything waiting to send") is asked from whatever screen
       the user happens to be on, and the answer used to be two taps deep under
       More. It is a status light and an entry point, not the sync trigger --
       the trigger is the wide button on the Identify screen and on the Cloud
       sync page, so tapping this never fires a network write by surprise. -->
  <button class="syncchip hidden" id="syncchip" data-act="nav" data-arg="sync"></button>
</header>
<main id="view"></main>
<nav class="tabs noprint" id="tabs" aria-label="Sections"></nav>
<!--APP-->
</body>
</html>
