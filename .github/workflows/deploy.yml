# Publishes both PWAs to GitHub Pages:
#   /            -> Zero
#   /bench/      -> Bench
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # `npm ci`, not `npm install`. The dependency ranges are carets, so
      # install can silently resolve outside the lockfile -- most
      # consequentially react, which ships into the user-facing bundle, and
      # playwright, whose ^1.47.0 admits any 1.x. A dependency bump nobody
      # chose should not be able to change a production bundle or turn CI red
      # on a day unrelated to any commit.
      - run: npm ci
      # Same assembly step Vercel runs. Two procedures that must agree is the
      # same shape of mistake as a hand-copied source file; there is one.
      #
      # The backend comes from repository VARIABLES (not secrets): the
      # publishable key is public by design and ships in the bundle either way.
      # build:site refuses to assemble without one rather than shipping an app
      # that shows a signed-in user the manual server-address fields again and
      # quietly stops syncing.
      - run: npm run build:site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
