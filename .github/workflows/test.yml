name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sql:
    name: schema + RLS (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build the database from the migrations
        run: |
          psql -c 'create database shooting'
          # harness.sql stubs the auth schema so the migrations can run in
          # vanilla Postgres. It is NEVER deployed; Supabase provides the real one.
          psql -d shooting -v ON_ERROR_STOP=1 -f supabase/test/harness.sql
          for m in supabase/migrations/*.sql; do
            echo "== $m"
            psql -d shooting -v ON_ERROR_STOP=1 -f "$m"
          done
          psql -d shooting -c 'create schema if not exists test;
            grant usage on schema test to authenticated, anon;'
      - name: Run every RLS suite
        run: |
          # A GLOB, not a list. The list said rls_test..rls_test6 while
          # run_tests.sh ran eight, so the two newest suites -- account backups
          # and the shot string, which is to say the two most likely to have a
          # mistake in them -- were the two nobody re-checked on a pull request.
          # A migration that gutted the keyset indexes merged green.
          rc=0
          shopt -s nullglob
          # `sort -V`, which run_tests.sh has had all along and this did not.
          # A plain glob is LEXICOGRAPHIC: the moment a tenth suite existed,
          # rls_test10 sorted between rls_test.sql and rls_test2 and ran second
          # -- eight files before the one that sets up what it builds on. The
          # two runners must agree on order, or CI is testing a sequence no
          # developer ever runs.
          for t in $(ls supabase/test/rls_test*.sql | sort -V); do
            echo "== $t"
            psql -d shooting -v ON_ERROR_STOP=1 -f "$t" 2>&1 | tee out.txt || rc=1
            # A psql ERROR aborts the script without ever printing FAIL, so
            # grepping for FAIL alone reports success on a suite that died.
            grep -q 'ERROR:' out.txt && rc=1
            grep -q FAIL out.txt && rc=1
          done
          [ $rc -eq 0 ] || { echo '::error::SQL suites failed'; exit 1; }
          echo 'SQL suites passed'

  js:
    name: zero-core + both apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # `npm ci`, not `npm install`. The dependency ranges are carets, so
      # install can silently resolve outside the lockfile -- most
      # consequentially react, which ships into the user-facing bundle, and
      # playwright, whose ^1.47.0 admits any 1.x. A dependency bump nobody
      # chose should not be able to change a production bundle or turn CI red
      # on a day unrelated to any commit.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # NOT `|| true`. That threw away the exit code of the only place preflight
      # runs, so all of its assertions -- maskable icons, relative start_url,
      # safe-area insets, the embed-core check being wired into npm test -- were
      # advisory. A deploy bug it exists to catch shipped green.
      #
      # The backend config is genuinely absent in a fork, so that half is told
      # to skip rather than the whole thing being ignored.
      # BEFORE preflight, because three of preflight's checks read the EMITTED
      # information page -- the doctype, the charset and the viewport that a
      # static host does not supply and an Artifact host does. site-info/dist
      # is gitignored, so on a fresh checkout it does not exist and those three
      # assertions were skipped in silence: they passed locally only because a
      # dist from an earlier build happened to be lying around. `npm run build`
      # is bench+zero and does not reach the page.
      - run: npm run build:site
        env:
          ALLOW_UNCONFIGURED_BUILD: '1'
      - run: node tools/preflight.mjs
        env:
          PREFLIGHT_SKIP_CONFIG: '1'
      - run: npm run build
      - run: npm test
