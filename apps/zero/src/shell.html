<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Precision shooting log: sessions, shot plotting, DOPE, analytics and live pair fire. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Zero</title>
<style>
/* The ground, before the bundle exists.
 *
 * Zero's palette lives in Zero.jsx, injected as a <style> by the first render
 * -- which is a whole screen of painting too late. The body used to carry
 * background:#0f1117 inline for exactly that reason, and now that the ground
 * has two values it needs the same head start with a query in front of it.
 * Only the ground: everything else is on the far side of a paint that already
 * has the real stylesheet.
 *
 * Its own variable rather than --bg, because Zero.jsx owns --bg and two
 * definitions of one token in two files is how they end up disagreeing. */
:root{color-scheme:light;--boot:#e4e1d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--boot:#0f1117}}
:root[data-theme="dark"]{color-scheme:dark;--boot:#0f1117}
body{margin:0;background:var(--boot)}
</style>
<script>
/* The theme, before the first paint.
 *
 * No stored preference means no attribute, which is deliberate: the CSS then
 * answers to prefers-color-scheme on its own. theme_v1 is written by
 * More > Appearance and is per-device on purpose -- it describes the screen in
 * your hand, not the account, so it is not in the backup, not in the export
 * and not in the cloud sync. Bare key, like every other key this app owns. */
(function () {
  try {
    var t = localStorage.getItem('theme_v1');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var dark = t ? t === 'dark'
      : !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
    /* iOS paints the status bar from this, and it is the one piece of chrome
     * the stylesheet cannot reach. The tag keeps the launch colour in the file
     * so the splash screen and the manifest still agree. */
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#0f1117' : '#e4e1d8');
  } catch (e) { /* private mode, or no storage at all: the CSS default stands */ }
})();
</script>
</head>
<body>
<div id="root"></div>
<script src="bundle.js"></script>
<script>
/* Registered from the page, not the bundle, so a bundle parse error still
 * leaves a working installed shell to load the next build over. */
if ('serviceWorker' in navigator) {
  /* Registered with the build id in the query string, and that is load-bearing.
   *
   * The worker is the one file whose entire job is to notice that a new build
   * exists -- so it is the one file that must never be answered from a cache.
   * `Cache-Control: must-revalidate` is set on it in vercel.json and a stale
   * copy was served anyway: the bare URL returned a previous deployment's
   * worker while the same URL with any query string returned the current one.
   * Whatever layer was holding it, a URL that changes every build cannot be
   * held at all. The scope comes from the PATH, so a query string does not
   * narrow or move it. */
  addEventListener('load', () => navigator.serviceWorker
    .register('sw.js?v=' + encodeURIComponent(window.__BUILD__ || 'dev'))
    .catch(() => {}));
}
</script>
</body></html>
